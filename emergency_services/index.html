<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HealthX Emergency Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
      <!-- Load Core Layout CSS -->
    <link rel="stylesheet" href="/emergency/css/layout.css">
    <link rel="stylesheet" href="/emergency/css/routingManager.css">
    <!-- ADD THIS LINE: -->
    <link rel="stylesheet" href="/emergency/css/emergencyManager.css">

    
</head>

<body>

    <div id="map-container">
        <div id="flat-map-view" class="map-layer active"></div>
        <div id="sphere-map-view" class="map-layer hidden"></div>
    </div>

    <div id="ui-layer">

        <!-- Top Bar -->
        <header id="top-bar" class="solid-panel">
            <div class="brand">HealthX Command</div>
            <div class="top-actions">
                <div id="auth-status" class="status-indicator">Authenticating...</div>
                <button id="btn-logout">Logout</button>
            </div>
        </header>

        <!-- Side Navigation Dock -->
        <nav id="side-dock" class="solid-panel">
            <button class="dock-btn" data-target="panel-map-controls" type="button" title="Map layers">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6 8 2l8 4 7-4v16l-7 4-8-4-7 4V6Z"/><path d="M8 2v16M16 6v16"/></svg>
                <span class="tooltip">Map Layers</span>
            </button>

            <button class="dock-btn" data-target="panel-routing" type="button" title="Route dispatch">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19c4-8 6-10 14-14"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
                <span class="tooltip">Route Dispatch</span>
            </button>

            <button class="dock-btn" data-target="panel-tracking" type="button" title="Live tracking">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
                <span class="tooltip">Live Tracking</span>
            </button>
                        <!-- NEW: Emergency Manager Button -->
            <button class="dock-btn" id="btn-open-em-manager" type="button" title="Emergency Manager">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M12 8v4M12 16h.01"/>
                </svg>
                <span class="tooltip">Emergencies</span>
            </button>
            <!-- End NEW -->

            <div class="dock-spacer"></div>

            <button id="btn-theme-toggle" class="dock-btn" type="button" title="Toggle theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span class="tooltip">Toggle Theme</span>
            </button>

            <button id="btn-collapse-all" class="dock-btn" type="button" title="Collapse panels">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5-5 5 5M7 14l5 5 5-5"/></svg>
                <span class="tooltip">Collapse Panels</span>
            </button>
        </nav>

        <!-- Flyout Panels -->
        <div id="flyout-container">

            <!-- Map Controls -->
            <section id="panel-map-controls" class="flyout-panel solid-panel hidden">
                <h3>Map Configuration</h3>
                <div class="control-group">
                    <label>Dimensional View</label>
                    <select id="view-mode-select">
                        <option value="2D">2D Tactical Map</option>
                        <option value="3D">3D Photorealistic Earth</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Map Layer</label>
                    <select id="tile-layer-select">
                        <option value="roadmap">Political / Roads</option>
                        <option value="satellite">Satellite</option>
                        <option value="terrain">Terrain</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>
            </section>

            <!-- Routing Panel: Only contains the mount point now -->
            <section id="panel-routing" class="flyout-panel solid-panel hidden">
                <!-- The RoutingManager class will auto-inject the UI here -->
                <div id="routing-ui-container"></div>
            </section>

            <!-- Tracking Panel -->
            <section id="panel-tracking" class="flyout-panel solid-panel hidden">
                <h3>Active Emergencies</h3>
                <ul id="active-tracking-list">
                    <li class="empty-state">No active tracking sessions.</li>
                </ul>
            </section>

        </div>
    </div>

    <!-- Core Scripts -->
    <script src="/emergency/js/core/events.js"></script>
    <script src="/emergency/js/core/auth.js"></script>
    <script src="/emergency/js/services/apiConfig.js"></script>
    <script src="/emergency/js/core/mapLoader.js"></script>
    
    <!-- UI & Map Managers -->
    <script src="/emergency/js/ui/panels.js"></script>
     <script src="/emergency/js/ui/emergencyManager.js"></script>
    <script src="/emergency/js/ui/mapControls.js"></script>
    <script src="/emergency/js/ui/mapControls.js"></script>
    <script src="/emergency/js/maps/tileManager.js"></script>
    <script src="/emergency/js/maps/flatMap.js"></script>
    <script src="/emergency/js/maps/sphereMap.js"></script>
    <script src="/emergency/js/maps/markerManager.js"></script>
    
    <!-- Services & Routing UI -->
    <script src="/emergency/js/services/gpsTracker.js"></script>
    <script src="/emergency/js/services/placesAutocomplete.js"></script>
    <script src="/emergency/js/ui/routingManager.js"></script>

</body>
</html>
