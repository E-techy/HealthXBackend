<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthX Emergency Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/emergency/css/layout.css">
</head>
<body>

    <!-- LAYER 0: MAPS -->
    <div id="map-container">
        <div id="flat-map-view" class="map-layer active"></div>
        <div id="sphere-map-view" class="map-layer hidden"></div>
    </div>

    <!-- LAYER 10: UI WRAPPER -->
    <div id="ui-layer" style="display: none;">
        
        <!-- TOP BAR (Minimalist) -->
        <header id="top-bar">
            <div class="brand">HealthX Command</div>
            <div class="top-actions">
                <div id="auth-status" class="status-indicator">Authenticating...</div>
                <button id="btn-logout">Logout</button>
            </div>
        </header>

        <!-- THE VERTICAL ICON DOCK -->
        <nav id="side-dock">
            <button class="dock-btn" data-target="panel-map-controls">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
                <span class="tooltip">Map Layers</span>
            </button>
            <button class="dock-btn" data-target="panel-routing">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span class="tooltip">Dispatch Route</span>
            </button>
            <button class="dock-btn" data-target="panel-tracking">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                <span class="tooltip">Live Emergencies</span>
            </button>
            
            <div class="dock-spacer"></div>

            <!-- Theme & Collapse Controls -->
            <button class="dock-btn action-btn" id="btn-theme-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <span class="tooltip">Toggle Theme</span>
            </button>
            <button class="dock-btn action-btn" id="btn-collapse-all">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span class="tooltip">Collapse Panels</span>
            </button>
        </nav>

        <!-- FLYOUT PANELS CONTAINER -->
        <div id="flyout-container">
            
            <!-- Map Controls -->
            <div id="panel-map-controls" class="flyout-panel hidden">
                <h3>Map Configuration</h3>
                <div class="control-group">
                    <label>Dimensional View</label>
                    <select id="view-mode-select">
                        <option value="2D">2D Tactical Map</option>
                        <option value="3D">3D Photorealistic Earth</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Map Layer</label>
                    <select id="tile-layer-select">
                        <option value="roadmap">Political / Roads</option>
                        <option value="satellite">Satellite (No Labels)</option>
                        <option value="terrain">Terrain</option>
                        <option value="hybrid">Hybrid (Satellite + Labels)</option>
                    </select>
                </div>
            </div>

            <!-- Routing & Dispatch -->
            <div id="panel-routing" class="flyout-panel hidden">
                <h3>Route Dispatch</h3>
                <div class="control-group">
                    <label>Origin</label>
                    <div class="input-with-actions">
                        <input type="text" id="route-origin" placeholder="GPS or Address" readonly>
                        <button class="action-icon" id="btn-loc-origin" title="Use Current Device Location">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.9 12.1a8 8 0 1 0-15.8 0"></path><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line></svg>
                        </button>
                        <button class="action-icon" id="btn-map-origin" title="Pick from Map">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>Destination</label>
                    <div class="input-with-actions">
                        <input type="text" id="route-dest" placeholder="GPS or Address" readonly>
                        <button class="action-icon" id="btn-loc-dest" title="Use Current Device Location">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.9 12.1a8 8 0 1 0-15.8 0"></path><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line></svg>
                        </button>
                        <button class="action-icon" id="btn-map-dest" title="Pick from Map">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button id="btn-calculate-route" class="primary-btn">Calculate Path</button>
            </div>

            <!-- Tracking -->
            <div id="panel-tracking" class="flyout-panel hidden">
                <h3>Active Emergencies</h3>
                <ul id="active-tracking-list">
                    <li class="empty-state">No active tracking sessions.</li>
                </ul>
            </div>

        </div>
    </div>

    <!-- SCRIPT IMPORTS -->
    <script src="/emergency/js/core/events.js"></script>
    <script src="/emergency/js/core/auth.js"></script>
    <script src="/emergency/js/core/mapLoader.js"></script>
    
    <script src="/emergency/js/ui/panels.js"></script>
    <script src="/emergency/js/ui/mapControls.js"></script>

    <script src="/emergency/js/services/routingApi.js"></script>
    <script src="/emergency/js/services/gpsTracker.js"></script>

    <script src="/emergency/js/maps/tileManager.js"></script>
    <script src="/emergency/js/maps/flatMap.js"></script>
    <script src="/emergency/js/maps/sphereMap.js"></script>
    <script src="/emergency/js/rendering/plotter.js"></script>
    <script src="/emergency/js/maps/markerManager.js"></script>
</body>
</html>
