<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealthX Emergency Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/emergency/css/layout.css">
</head>

<body>

<div id="map-container">
    <div id="flat-map-view" class="map-layer active"></div>
    <div id="sphere-map-view" class="map-layer hidden"></div>
</div>

<div id="ui-layer">

<header id="top-bar" class="glass-panel">
    <div class="brand">HealthX Command</div>
    <div class="top-actions">
        <div id="auth-status" class="status-indicator">Authenticating...</div>
        <button id="btn-logout">Logout</button>
    </div>
</header>

<nav id="side-dock" class="glass-panel">

    <button class="dock-btn" data-target="panel-map-controls" type="button" title="Map layers">
        <svg viewBox="0 0 24 24"><path d="M1 6 8 2l8 4 7-4v16l-7 4-8-4-7 4V6Z"/><path d="M8 2v16M16 6v16"/></svg>
        <span class="tooltip">Map Layers</span>
    </button>

    <button class="dock-btn" data-target="panel-routing" type="button" title="Route dispatch">
        <svg viewBox="0 0 24 24"><path d="M5 19c4-8 6-10 14-14"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
        <span class="tooltip">Route Dispatch</span>
    </button>

    <button class="dock-btn" data-target="panel-tracking" type="button" title="Live tracking">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        <span class="tooltip">Live Tracking</span>
    </button>

    <div class="dock-spacer"></div>

    <button id="btn-theme-toggle" class="dock-btn" type="button" title="Toggle theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="tooltip">Toggle Theme</span>
    </button>

    <button id="btn-collapse-all" class="dock-btn" type="button" title="Collapse panels">
        <svg viewBox="0 0 24 24"><path d="m7 10 5-5 5 5M7 14l5 5 5-5"/></svg>
        <span class="tooltip">Collapse Panels</span>
    </button>

</nav>

<div id="flyout-container">

<section id="panel-map-controls" class="flyout-panel glass-panel hidden">
    <h3>Map Configuration</h3>

    <div class="control-group">
        <label>Dimensional View</label>
        <select id="view-mode-select">
            <option value="2D">2D Tactical Map</option>
            <option value="3D">3D Photorealistic Earth</option>
        </select>
    </div>

    <div class="control-group">
        <label>Map Layer</label>
        <select id="tile-layer-select">
            <option value="roadmap">Political / Roads</option>
            <option value="satellite">Satellite</option>
            <option value="terrain">Terrain</option>
            <option value="hybrid">Hybrid</option>
        </select>
    </div>
</section>

<section id="panel-routing" class="flyout-panel glass-panel hidden">

    <div class="panel-heading-row">
        <div>
            <h3>Route Dispatch</h3>
            <span class="panel-subtitle">Edit one point at a time</span>
        </div>
    </div>

    <div id="route-points-container" class="routing-timeline">

        <!-- ORIGIN -->
        <div class="route-node is-expanded" data-id="origin">

            <div class="node-connector">
                <div class="dot origin-dot"></div>
                <div class="line"></div>
            </div>

            <div class="node-content">

                <div class="point-editor">

                    <div class="point-editor-head">
                        <span class="point-type">Origin</span>
                        <button class="icon-button btn-collapse-point" type="button" title="Collapse origin">⌃</button>
                    </div>

                    <div class="input-wrapper">
                        <input id="input-origin" type="text" placeholder="Search starting address...">

                        <button class="action-icon btn-loc" type="button" title="Use current location">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19 12c0-3.9-3.1-7-7-7s-7 3.1-7 7c0 4.3 4.8 10 7 10s7-5.7 7-10Z"/>
                            </svg>
                        </button>

                        <button class="action-icon btn-map" type="button" title="Pick location on map">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/>
                                <circle cx="12" cy="9" r="2.5"/>
                            </svg>
                        </button>
                    </div>

                    <div class="point-meta">
                        <label>
                            Label
                            <input class="point-label-input" maxlength="80" placeholder="Origin">
                        </label>

                        <label class="image-picker">
                            Image
                            <input class="point-image-input" type="file" accept="image/*">
                            <span>＋ Attach image</span>
                        </label>

                        <div class="point-image-preview-wrap">
                            <img class="point-image-preview" alt="">
                            <button class="point-image-remove" type="button" title="Remove image">×</button>
                        </div>
                    </div>

                    <div class="point-tools">
                        <button class="point-tool btn-add-marker" type="button" title="Add marker">
                            ＋ Add Marker
                        </button>

                        <button class="point-tool btn-remove-marker" type="button" title="Remove marker and clear point">
                            − Remove Marker
                        </button>

                        <span class="marker-state">No marker</span>
                    </div>

                </div>

                <button class="point-summary" type="button">
                    <span class="point-summary-image-wrap">
                        <img class="point-summary-image" alt="">
                    </span>
                    <span>
                        <strong class="point-summary-label">Origin</strong>
                        <small class="point-summary-address">Choose a starting address</small>
                    </span>
                    <b>⌄</b>
                </button>

            </div>
        </div>

        <!-- CHECKPOINTS -->
        <div id="checkpoints-list"></div>

        <!-- ADD CHECKPOINT -->
        <div class="route-node add-cp-node" id="btn-add-checkpoint" role="button" tabindex="0">

            <div class="node-connector">
                <div class="dot add-dot">＋</div>
                <div class="line"></div>
            </div>

            <div class="node-content">
                <span class="add-text-btn">Add checkpoint</span>
            </div>

        </div>

        <!-- DESTINATION -->
        <div class="route-node" data-id="destination">

            <div class="node-connector">
                <div class="dot dest-dot"></div>
            </div>

            <div class="node-content">

                <div class="point-editor">

                    <div class="point-editor-head">
                        <span class="point-type">Destination</span>
                        <button class="icon-button btn-collapse-point" type="button" title="Collapse destination">⌃</button>
                    </div>

                    <div class="input-wrapper">
                        <input id="input-destination" type="text" placeholder="Search destination...">

                        <button class="action-icon btn-loc" type="button" title="Use current location">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19 12c0-3.9-3.1-7-7-7s-7 3.1-7 7c0 4.3 4.8 10 7 10s7-5.7 7-10Z"/>
                            </svg>
                        </button>

                        <button class="action-icon btn-map" type="button" title="Pick location on map">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/>
                                <circle cx="12" cy="9" r="2.5"/>
                            </svg>
                        </button>
                    </div>

                    <div class="point-meta">
                        <label>
                            Label
                            <input class="point-label-input" maxlength="80" placeholder="Destination">
                        </label>

                        <label class="image-picker">
                            Image
                            <input class="point-image-input" type="file" accept="image/*">
                            <span>＋ Attach image</span>
                        </label>

                        <div class="point-image-preview-wrap">
                            <img class="point-image-preview" alt="">
                            <button class="point-image-remove" type="button" title="Remove image">×</button>
                        </div>
                    </div>

                    <div class="point-tools">
                        <button class="point-tool btn-add-marker" type="button" title="Add marker">
                            ＋ Add Marker
                        </button>

                        <button class="point-tool btn-remove-marker" type="button" title="Remove marker and clear point">
                            − Remove Marker
                        </button>

                        <span class="marker-state">No marker</span>
                    </div>

                </div>

                <button class="point-summary" type="button">
                    <span class="point-summary-image-wrap">
                        <img class="point-summary-image" alt="">
                    </span>
                    <span>
                        <strong class="point-summary-label">Destination</strong>
                        <small class="point-summary-address">Choose a destination</small>
                    </span>
                    <b>⌄</b>
                </button>

            </div>
        </div>

    </div>

    <div class="route-actions-divider"></div>

    <div class="control-group">
        <label>Response Mode</label>
        <select id="route-mode">
            <option value="DRIVE">Police Cruiser (Drive)</option>
            <option value="TWO_WHEELER">First Responder (Bike)</option>
        </select>
    </div>

    <button id="btn-calculate-route" class="primary-btn" type="button">
        <svg viewBox="0 0 24 24">
            <path d="M4 19 20 5M7 19h-3v-3M20 5v3M9 14l3-3"/>
            <circle cx="4" cy="19" r="2"/>
            <circle cx="20" cy="5" r="2"/>
        </svg>
        <span>Calculate Path</span>
    </button>

</section>

<section id="panel-tracking" class="flyout-panel glass-panel hidden">
    <h3>Active Emergencies</h3>
    <ul id="active-tracking-list">
        <li class="empty-state">No active tracking sessions.</li>
    </ul>
</section>

</div>
</div>
<script src="/emergency/js/core/events.js"></script>
<script src="/emergency/js/core/auth.js"></script>
<script src="/emergency/js/core/mapLoader.js"></script>
<script src="/emergency/js/ui/panels.js"></script>
<script src="/emergency/js/ui/mapControls.js"></script>
<script src="/emergency/js/services/routingApi.js"></script>
<script src="/emergency/js/services/gpsTracker.js"></script>
<script src="/emergency/js/services/placesAutocomplete.js"></script>
<script src="/emergency/js/maps/tileManager.js"></script>
<script src="/emergency/js/maps/flatMap.js"></script>
<script src="/emergency/js/maps/sphereMap.js"></script>
<script src="/emergency/js/maps/markerManager.js"></script>
</body>
</html>
